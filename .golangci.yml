# golangci-lint configuration for North.
# Keep this thin — prefer gofmt/go vet defaults over a large rule farm.

version: "2"

run:
  # Generous because a cold run is slow, not because the analysis is: the run
  # that forced this printed "0 issues." and only then failed on elapsed time,
  # having taken ~34 minutes on a CI runner with no build cache. A warm run is
  # seconds. Five minutes was fine until the module moved to Go 1.27 and the
  # linter to 2.13.0, which together made the first, uncached typecheck of the
  # whole module far more expensive.
  #
  # If a warm run ever approaches this, that is a regression worth chasing
  # rather than a number worth raising again.
  timeout: 45m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    govet:
      enable:
        - shadow

  exclusions:
    # templ emit nests `ctx` and a buffer in every child; govet/shadow and
    # staticcheck SA4006 fire on every page. Those files are gitignored and
    # rewritten by `templ generate` — lint the .templ, not the dump.
    generated: lax
    paths:
      - '.*_templ\.go$'
      # Huge auto-generated Lucide icon dumps from templUI.
      - web/shared/ui/icon/icon_data\.go
      - web/shared/ui/icon/icon_defs\.go

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - '.*_templ\.go$'
      - web/shared/ui/icon/icon_data\.go
      - web/shared/ui/icon/icon_defs\.go
