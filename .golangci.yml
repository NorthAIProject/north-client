# golangci-lint configuration for North.
# Keep this thin — prefer gofmt/go vet defaults over a large rule farm.

version: "2"

run:
  # A cold run of the whole module is seconds locally and about two minutes
  # on a CI runner. The 45 minutes this once said was a misdiagnosis: the runs
  # that never finished were golangci-lint v2.13.0's staticcheck release
  # candidate failing to converge on templ-generated pages, not a slow
  # typecheck — see the version pin in .github/workflows/ci.yml. "0 issues."
  # followed by a timeout means the analysis was cut off, not that it passed.
  #
  # If a run approaches this again, find out why rather than raising it.
  timeout: 10m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    govet:
      enable:
        - shadow

  exclusions:
    # templ emit nests `ctx` and a buffer in every child; govet/shadow and
    # staticcheck SA4006 fire on every page. Those files are gitignored and
    # rewritten by `templ generate` — lint the .templ, not the dump.
    generated: lax
    paths:
      - '.*_templ\.go$'
      # Huge auto-generated Lucide icon dumps from templUI.
      - web/shared/ui/icon/icon_data\.go
      - web/shared/ui/icon/icon_defs\.go

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - '.*_templ\.go$'
      - web/shared/ui/icon/icon_data\.go
      - web/shared/ui/icon/icon_defs\.go
