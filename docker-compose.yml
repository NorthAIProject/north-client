services:
  postgres:
    # pgvector image rather than plain postgres: semantic search arrives in
    # Phase 2 and swapping the image later would mean recreating the volume.
    image: pgvector/pgvector:pg17
    container_name: north-postgres
    environment:
      POSTGRES_USER: north
      POSTGRES_PASSWORD: north
      POSTGRES_DB: north
    # 5434 on the host: a local Postgres install owns 5432, and OrbStack's
    # Kubernetes forwards 5433.
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U north -d north"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: north-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: north
      MINIO_ROOT_PASSWORD: northnorth
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first boot so uploads work without manual setup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 north northnorth &&
      mc mb --ignore-existing local/north-media &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
