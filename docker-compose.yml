# No fixed container_name: Compose scopes names to this project directory.
# Fixed names (north-postgres / north-minio) collide when the same services
# were started from another checkout or project label.
services:
  postgres:
    # pgvector image rather than plain postgres: semantic search arrives in
    # Phase 2 and swapping the image later would mean recreating the volume.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: north
      POSTGRES_PASSWORD: north
      POSTGRES_DB: north
    # 5434 on the host: a local Postgres install owns 5432, and OrbStack's
    # Kubernetes forwards 5433.
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U north -d north"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: north
      MINIO_ROOT_PASSWORD: northnorth
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # minio image has curl; mc is only in the minio/mc image used by minio-init.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first boot so uploads work without manual setup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 north northnorth &&
      mc mb --ignore-existing local/north-media &&
      echo 'bucket ready'
      "

  # The same image and settings the cluster runs
  # (platform/infra/apps/whisper/values-common.yaml), so a voice note that works
  # here works deployed. CPU int8: seconds, not milliseconds.
  #
  # First boot pulls the image and downloads both models — a few hundred MB and
  # several minutes, during which voice fails and says so. Nothing else waits
  # for it.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.7.0-cpu
    ports:
      - "8000:8000"
    environment:
      # Loaded at startup. The container exits if a name is wrong, so a typo is
      # a crashloop rather than a silent fallback. Two models because .en is
      # English-only and is the better choice when English is what was spoken.
      PRELOAD_MODELS: '["Systran/faster-whisper-small.en","Systran/faster-whisper-small"]'
      # Never unload. The default drops a model after five idle minutes and the
      # next recording pays the whole load cost again.
      STT_MODEL_TTL: "-1"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "2"
      LOG_LEVEL: info
    volumes:
      # The same path the chart mounts its PVC at. Named, so `task db:down` does
      # not throw away a download measured in hundreds of megabytes.
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  postgres-data:
  minio-data:
  whisper-models:
