<!doctype html>
<!--
  A page for looking at the figure on its own, without the app around it.
  Serve it with ./serve.py from the repository root, then open
  http://127.0.0.1:8099/?variant=a&theme=dark&shell=0.25&side=front, or run
  ./shoot.sh for headless screenshots of every combination.

  The colour tokens below are candidates: iterate them here, then copy the
  winners into web/assets/css/input.css.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>body map preview</title>
    <style>
      :root {
        --north-body-idle: oklch(0.66 0.035 250);
        --north-body-base: oklch(0.8 0.015 60);
        --north-body-shell: oklch(0.86 0.02 250);
        --north-body-core: oklch(0.32 0.02 250);
        --north-heat-low: oklch(0.8 0.1 80);
        --north-ember: oklch(0.62 0.15 62);
        --surface: #f8fafc;
      }
      html.dark {
        --north-body-idle: oklch(0.5 0.04 250);
        --north-body-base: oklch(0.42 0.02 60);
        --north-body-shell: oklch(0.74 0.03 250);
        --north-body-core: oklch(0.17 0.015 250);
        --north-heat-low: oklch(0.62 0.09 88);
        --north-ember: oklch(0.76 0.16 62);
        --surface: #111418;
      }
      body {
        margin: 0;
        background: var(--surface);
        font: 13px system-ui, sans-serif;
        color: #7c8794;
      }
      canvas {
        display: block;
        width: 600px;
        height: 760px;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="figure" width="600" height="760"></canvas>
    <div id="status">loading</div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const dark = q.get("theme") !== "light";
      document.documentElement.classList.toggle("dark", dark);
      const status = document.getElementById("status");
      try {
        const { createViewer } = await import("/assets/js/shared/muscle-viewer/viewer.js");
        const viewer = await createViewer(document.getElementById("figure"), {
          dark,
          reduced: true,
          variant: q.get("variant") || "a",
          shellOpacity: Number(q.get("shell") || 0.25),
          model: q.get("model") || undefined,
        });
        if (q.get("heat") !== "none") {
          viewer.setHeat({ quads: 1, glutes: 0.5, chest: 0.6, delts: 0.3, abs: 0.1, lats: 0.8 });
        }
        viewer.face(q.get("side") || "front");
        status.textContent = `ok ${location.search}`;
      } catch (err) {
        status.textContent = `error: ${err.message}`;
      }
    </script>
  </body>
</html>
