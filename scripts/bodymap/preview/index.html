<!doctype html>
<!--
  A page for looking at the figure on its own, without the app around it.
  Serve it with ./serve.py from the repository root, then open
  http://127.0.0.1:8099/?theme=dark&side=front (also ?heat=none, ?w=150&h=220
  for a card's size, ?model=/assets/models/other.glb to compare builds), or
  run ./shoot.sh for headless screenshots.

  The colour tokens below mirror web/assets/css/input.css. To try a palette,
  change them here first, then copy the winners across.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>body map preview</title>
    <style>
      :root {
        --north-body-idle: oklch(0.58 0.045 250);
        --north-body-shell: oklch(0.86 0.02 250);
        --north-body-core: oklch(0.32 0.02 250);
        --north-heat-low: oklch(0.78 0.09 85);
        --north-ember: oklch(0.62 0.15 62);
        --surface: #f8fafc;
      }
      html.dark {
        --north-body-idle: oklch(0.43 0.05 250);
        --north-body-shell: oklch(0.74 0.03 250);
        --north-body-core: oklch(0.17 0.015 250);
        --north-heat-low: oklch(0.58 0.08 82);
        --north-ember: oklch(0.76 0.16 62);
        --surface: #111418;
      }
      body {
        margin: 0;
        background: var(--surface);
        font: 13px system-ui, sans-serif;
        color: #7c8794;
      }
      canvas {
        display: block;
        width: 600px;
        height: 760px;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="figure" width="600" height="760"></canvas>
    <div id="status">loading</div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const dark = q.get("theme") !== "light";
      document.documentElement.classList.toggle("dark", dark);
      const status = document.getElementById("status");
      const canvas = document.getElementById("figure");
      // ?w=150&h=220 draws the figure at a card's size, for judging it small.
      if (q.get("w") && q.get("h")) {
        canvas.style.width = `${q.get("w")}px`;
        canvas.style.height = `${q.get("h")}px`;
      }
      try {
        const { createViewer } = await import("/assets/js/shared/muscle-viewer/viewer.js");
        const viewer = await createViewer(canvas, {
          dark,
          reduced: true,
          model: q.get("model") || undefined,
        });
        if (q.get("heat") !== "none") {
          viewer.setHeat({ quads: 1, glutes: 0.5, chest: 0.6, delts: 0.3, abs: 0.1, lats: 0.8 });
        }
        // ?shape=0.5 sets every shape key; ?shape=waist:1,hips:0.4 sets some.
        if (q.get("shape")) {
          const raw = q.get("shape");
          const shape = {};
          if (raw.includes(":")) {
            for (const part of raw.split(",")) {
              const [name, value] = part.split(":");
              shape[name] = Number(value);
            }
          } else {
            for (const name of ["waist", "hips", "chest", "overall"]) shape[name] = Number(raw);
          }
          viewer.setShape(shape);
        }
        viewer.face(q.get("side") || "front");
        status.textContent = `ok ${location.search}`;
      } catch (err) {
        status.textContent = `error: ${err.message}`;
      }
    </script>
  </body>
</html>
