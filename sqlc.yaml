version: "2"

# One sqlc package per vertical slice: a slice owns its queries and its
# generated code, so adding a feature never edits another slice's files.
# Every package reads the same migrations directory for the schema.
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/users/db/queries.sql
    gen:
      go: &gen
        package: usersdb
        out: internal/users/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true

  - engine: postgresql
    schema: migrations
    queries: internal/auth/db/queries.sql
    gen:
      go:
        <<: *gen
        package: authdb
        out: internal/auth/db
        overrides: *overrides

  - engine: postgresql
    schema: migrations
    queries: internal/conversations/db/queries.sql
    gen:
      go:
        <<: *gen
        package: conversationsdb
        out: internal/conversations/db
        overrides: *overrides
