version: "2"

# One sqlc package per vertical slice: a slice owns its queries and its
# generated code, so adding a feature never edits another slice's files.
# Every package reads the same migrations directory for the schema.
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/users/db/queries.sql
    gen:
      go: &gen
        package: usersdb
        out: internal/users/db
        sql_package: pgx/v5
        # Each slice gets structs for the tables its own queries touch, and
        # nothing else.
        #
        # Without this, every one of the 33 packages below generated a struct
        # for every table in the schema — 22,866 lines of identical models, and
        # a one-column migration showed up as 33 changed files. That made schema
        # diffs unreviewable and buried real generated-code changes in noise.
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true

  - engine: postgresql
    schema: migrations
    queries: internal/auth/db/queries.sql
    gen:
      go:
        <<: *gen
        package: authdb
        out: internal/auth/db
        overrides: *overrides

  - engine: postgresql
    schema: migrations
    queries: internal/conversations/db/queries.sql
