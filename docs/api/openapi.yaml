        range:
          $ref: '#/components/schemas/InsightsRange'
        turns:
          type: integer
        yourMessages:
          type: integer
        coachReplies:
          type: integer
        hasRatings:
          type: boolean
        helpfulRate:
          type: integer
        rated:
          type: integer
        chart:
          $ref: '#/components/schemas/InsightsChart'
        highlights:
          type: array
          items:
            type: string
        truncated:
          type: boolean
        hasData:
          type: boolean
    InsightsSpend:
      type: object
      required: [range, totalCost, totalTokens, generations, surfaces, models, hasData]
      properties:
        range:
          $ref: '#/components/schemas/InsightsRange'
        totalCost:
          type: string
        totalTokens:
          type: integer
        generations:
          type: integer
        surfaces:
          type: array
          items:
            $ref: '#/components/schemas/InsightsSpendLine'
        models:
          type: array
          items:
            $ref: '#/components/schemas/InsightsSpendLine'
        hasData:
          type: boolean
    InsightsSpendLine:
      type: object
      required: [label, cost, generations, tokens, pct]
      properties:
        label:
          type: string
        cost:
          type: string
        generations:
          type: integer
        tokens:
          type: integer
        pct:
          type: integer
    DietSettings:
      type: object
      required: [diets]
      properties:
        diets:
          type: array
          items:
            type: object
            required: [id, code, name, description, selected]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              description:
                type: string
              selected:
                type: boolean
    StravaStatus:
      type: object
      required: [configured, connected, syncPending]
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        lastSyncAttemptedAt:
          type: string
          format: date-time
        lastSyncError:
          type: string
        syncPending:
          type: boolean
    StravaConnect:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
    HealthSyncRequest:
      type: object
      properties:
        readings:
          type: array
          items:
            $ref: '#/components/schemas/HealthReading'
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/HealthWorkout'
    HealthReading:
      type: object
      required: [metric, value, unit, startedAt]
      properties:
        metric:
          type: string
          description: e.g. resting_heart_rate, hrv_sdnn, steps, active_calories, sleep_asleep, body_mass
        value:
          type: number
        unit:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Set for an interval (a day's steps, a block of sleep); absent for an instant.
    HealthWorkout:
      type: object
      required: [activityCode, externalId, startedAt, endedAt]
      properties:
        activityCode:
          type: string
        externalId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        calories:
          type: number
    HealthSyncResult:
      type: object
      required: [readings, workouts]
      properties:
        readings:
          type: integer
        workouts:
          type: integer
    LogActivityRequest:
      type: object
      required: [activityCode, durationMinutes]
      properties:
        activityCode:
          type: string
        startedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        distanceKm:
          type: number
