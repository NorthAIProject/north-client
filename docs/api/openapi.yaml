              type: string
            priorPct:
              type: integer
            hasPrior:
              type: boolean
        highlights:
          type: array
          items:
            type: string
        hasData:
          type: boolean
    StravaStatus:
      type: object
      required: [configured, connected, syncPending]
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        lastSyncAttemptedAt:
          type: string
          format: date-time
        lastSyncError:
          type: string
        syncPending:
          type: boolean
    StravaConnect:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
    HealthSyncRequest:
      type: object
      properties:
        readings:
          type: array
          items:
            $ref: '#/components/schemas/HealthReading'
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/HealthWorkout'
    HealthReading:
      type: object
      required: [metric, value, unit, startedAt]
      properties:
        metric:
          type: string
          description: e.g. resting_heart_rate, hrv_sdnn, steps, active_calories, sleep_asleep, body_mass
        value:
          type: number
        unit:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Set for an interval (a day's steps, a block of sleep); absent for an instant.
    HealthWorkout:
      type: object
      required: [activityCode, externalId, startedAt, endedAt]
      properties:
        activityCode:
          type: string
        externalId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        calories:
          type: number
    HealthSyncResult:
      type: object
      required: [readings, workouts]
      properties:
        readings:
          type: integer
        workouts:
          type: integer
    LogActivityRequest:
      type: object
      required: [activityCode, durationMinutes]
      properties:
        activityCode:
          type: string
        startedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        distanceKm:
          type: number
