      parameters:
        - name: range
          in: query
          required: false
          description: Range key, e.g. `today`, `7d`, `30d`. Defaults to today.
          schema:
            type: string
      responses:
        '200':
          description: Today snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /capture/parse:
    post:
      operationId: parseCapture
      summary: Parse a quick capture into proposed entries
      security:
        - connectionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Proposed entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /capture/commit:
    post:
      operationId: commitCapture
      summary: Commit selected capture entries
      security:
        - connectionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Commit outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token returned by the /auth routes.
    connectionToken:
      type: http
      scheme: bearer
      description: An `nk_` connection token from Settings → Connections.
  parameters:
    InsightsRange:
      name: range
      in: query
      required: false
      schema:
        type: string
      description: "A range key from the response's range.options (today, yesterday, week, month, quarter or year). Defaults to today."
    ConversationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageID:
      name: messageID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ReplyStream:
      description: Server-Sent Events carrying the reply; see the operation description
      content:
        text/event-stream:
          schema:
            type: string
            format: binary
    NotFound:
      description: No such resource for this account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Authenticated:
      description: Signed in; the token authenticates later requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    PasskeyCeremony:
      description: WebAuthn options for the device
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyCeremonyResponse'
    PasskeyExpired:
      description: The challenge expired or was already used; begin again
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    PasskeysUnavailable:
      description: Passkeys are not configured on this server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unavailable:
      description: A dependency failed; retrying may succeed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: The resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ContentTooLarge:
      description: Request body exceeds the endpoint limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    RateLimited:
      description: Request quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    ParseRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
    ParseResponse:
      type: object
      required: [items, unparsed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
        unparsed:
          type: array
          items:
            type: string
    CommitRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
    CommitResponse:
      type: object
      required: [written, failed, outcomes]
      properties:
        written:
          type: integer
        failed:
          type: integer
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
    CaptureItem:
      type: object
      required: [kind, source]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Capture kind identifying the populated payload.
          enum: [water, sleep, habit, weight, check_in, food]
        source:
          type: string
        uncertain:
          type: boolean
        problem:
          type: string
        water:
          $ref: '#/components/schemas/CaptureWater'
        sleep:
          $ref: '#/components/schemas/CaptureSleep'
        habit:
          $ref: '#/components/schemas/CaptureHabit'
        weight:
          $ref: '#/components/schemas/CaptureWeight'
        check_in:
          $ref: '#/components/schemas/CaptureCheckIn'
        food:
          $ref: '#/components/schemas/CaptureFood'
    Outcome:
      type: object
      required: [item]
      additionalProperties: false
      properties:
        item:
          $ref: '#/components/schemas/CaptureItem'
        summary:
          type: string
        error:
          type: string
    CaptureWater:
      type: object
      required: [amount_ml]
      additionalProperties: false
      properties:
        amount_ml:
          type: integer
    CaptureSleep:
      type: object
      required: [minutes, date]
      additionalProperties: false
      properties:
        minutes:
          type: integer
        date:
          type: string
          format: date-time
        quality:
          type: integer
    CaptureHabit:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        id:
          type: string
          format: uuid
    CaptureWeight:
      type: object
      required: [kg]
      additionalProperties: false
      properties:
        kg:
          type: number
    CaptureCheckIn:
      type: object
      required: [mood, energy]
      additionalProperties: false
      properties:
        mood:
          type: integer
        energy:
          type: integer
        notes:
          type: string
    CaptureFood:
      type: object
      required: [query, grams]
      additionalProperties: false
      properties:
        query:
          type: string
        grams:
          type: number
        ingredient_id:
          type: string
          format: uuid
        matched_name:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [message]
      properties:
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    SignupRequest:
      type: object
      required: [email, password, passwordConfirmation]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        passwordConfirmation:
          type: string
        displayName:
          type: string
        timezone:
          type: string
          description: IANA zone, e.g. Europe/Lisbon. Defaults to UTC.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    GoogleRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
    AppleRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string
          description: The raw nonce whose SHA-256 was sent to Apple.
        fullName:
          type: string
          description: Apple sends the name only on the first sign-in.
        email:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    AuthResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: "Opaque session token. Send as `Authorization: Bearer`."
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, displayName, timezone, needsOnboarding]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        timezone:
          type: string
        needsOnboarding:
          type: boolean
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    OnboardingRequest:
      type: object
      required: [focusAreas, coachingStyle]
      properties:
        focusAreas:
          type: array
          items:
            type: string
        coachingStyle:
          type: string
          description: direct, supportive, socratic or custom. Free text is treated as custom.
        coachingStyleCustom:
          type: string
        nearTermGoal:
          type: string
    OnboardingResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        threadId:
          type: string
          format: uuid
          description: The coach thread opened for the first conversation.
    TodayResponse:
      type: object
      required: [user, snapshot]
      properties:
        user:
          $ref: '#/components/schemas/User'
