          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsTicker'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights:
    get:
      operationId: getInsights
      summary: Every domain's score for a window, the pinned metrics and highlights
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/metrics/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: e.g. sleep, water, mood, energy, burn, sessions, steps, active-energy, resting-heart-rate, hrv
    get:
      operationId: getInsightMetric
      summary: One metric over a window, beside the window before it
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightMetric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /insights/timeline:
    get:
      operationId: getInsightsTimeline
      summary: Everything logged in a window, newest first, with a filter per kind
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: One entry kind (check_in, hydration, sleep, habit, journal, goal, goal_note, activity); omitted means everything.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsTimeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/body:
    get:
      operationId: getInsightsBody
      summary: Water, sleep and habit adherence over a window
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/mind:
    get:
      operationId: getInsightsMind
      summary: Mood, energy and journalling over a window
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsMind'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/progress:
    get:
      operationId: getInsightsProgress
      summary: Active goals, their progress and updates over a window
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/training:
    get:
      operationId: getInsightsTraining
      summary: Sessions, calories burned and activity mix over a window
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsTraining'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/nutrition:
    get:
      operationId: getInsightsNutrition
      summary: Calories and macros over a window, against the macro goal when one is set
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsNutrition'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/coach:
    get:
      operationId: getInsightsCoach
      summary: How much you talked to the coach and how helpful its replies were
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsCoach'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /insights/spend:
    get:
      operationId: getInsightsSpend
      summary: What AI generations cost over a window, by surface and by model
      parameters:
        - $ref: '#/components/parameters/InsightsRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsSpend'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /fitness/strava:
    get:
      operationId: getStravaStatus
      summary: Whether Strava is connected, and how its last sync went
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: disconnectStrava
      summary: Disconnect Strava; imported activities stay
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
  /fitness/strava/connect:
    post:
      operationId: connectStrava
      summary: Begin connecting Strava from the app
      description: >-
        Returns Strava's consent URL. Open it in an authentication session
        whose callback scheme is khepri; Strava returns through the server to
        khepri://fitness/strava?result=connected|cancelled|expired|failed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaConnect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /fitness/strava/sync:
    post:
      operationId: syncStrava
      summary: Queue a Strava sync now
      responses:
        '202':
          description: Queued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /fitness/strava/callback:
    get:
      operationId: stravaCallback
      summary: Strava's OAuth return for connections begun in the app
      description: Public, called by Strava; always redirects to khepri://fitness/strava.
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Back to the app
  /health/samples:
    post:
      operationId: syncHealth
      summary: Store readings and workouts read from Apple Health on the phone
      description: >-
        Replaying a batch is safe: readings are stored as sent and workouts are
        deduplicated by their Apple Health id, and a workout another provider
        already sent (the same run from Strava) is recognised by its time and
        not counted twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthSyncRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: forgetHealth
      summary: Delete every reading Apple Health sent; workouts stay in activity history
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /onboarding:
    post:
      operationId: completeOnboarding
      summary: Save first-run answers and open the first coach thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: Onboarding saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /today:
    get:
      operationId: getToday
      summary: The Today dashboard for a time range
      parameters:
        - name: range
          in: query
          required: false
          description: Range key, e.g. `today`, `7d`, `30d`. Defaults to today.
          schema:
            type: string
      responses:
        '200':
          description: Today snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /devices/apns:
    put:
      operationId: registerAPNsDevice
      summary: Register this install's APNs device token for nudges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APNsDeviceInput'
      responses:
        '204':
          description: Registered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /devices/apns/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: unregisterAPNsDevice
      summary: Forget this install's device token, as on sign-out
      responses:
        '204':
          description: Forgotten, or was never known
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /capture/parse:
    post:
      operationId: parseCapture
      summary: Parse a quick capture into proposed entries
      security:
        - connectionToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Proposed entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /capture/commit:
    post:
      operationId: commitCapture
      summary: Commit selected capture entries
      security:
        - connectionToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Commit outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token returned by the /auth routes.
    connectionToken:
      type: http
      scheme: bearer
      description: An `nk_` connection token from Settings → Connections.
  parameters:
    InsightsRange:
      name: range
      in: query
      required: false
      schema:
        type: string
      description: "A range key from the response's range.options (today, yesterday, week, month, quarter or year). Defaults to today."
    ConversationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageID:
      name: messageID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    TooManyRequests:
      description: This kind of request's quota is spent for now; see Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ReplyStream:
      description: Server-Sent Events carrying the reply; see the operation description
      content:
        text/event-stream:
          schema:
            type: string
            format: binary
    NotFound:
      description: No such resource for this account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Authenticated:
      description: Signed in; the token authenticates later requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    PasskeyCeremony:
      description: WebAuthn options for the device
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyCeremonyResponse'
    PasskeyExpired:
      description: The challenge expired or was already used; begin again
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    PasskeysUnavailable:
      description: Passkeys are not configured on this server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unavailable:
      description: A dependency failed; retrying may succeed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: The resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ContentTooLarge:
      description: Request body exceeds the endpoint limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    RateLimited:
      description: Request quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    APNsDeviceInput:
      type: object
      required: [token, topic, environment]
      properties:
        token:
          type: string
          description: The device token as 64 lowercase hex characters.
        topic:
          type: string
          description: The app's bundle identifier.
        environment:
          type: string
          enum: [production, sandbox]
          description: "`sandbox` for a build run from Xcode, `production` for TestFlight and the App Store."
    ParseRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
    ParseResponse:
      type: object
      required: [items, unparsed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
        unparsed:
          type: array
          items:
            type: string
    CommitRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
    CommitResponse:
      type: object
      required: [written, failed, outcomes]
      properties:
        written:
          type: integer
        failed:
          type: integer
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
    CaptureItem:
      type: object
      required: [kind, source]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Capture kind identifying the populated payload.
          enum: [water, sleep, habit, weight, check_in, food]
        source:
          type: string
        uncertain:
          type: boolean
        problem:
          type: string
        water:
          $ref: '#/components/schemas/CaptureWater'
        sleep:
          $ref: '#/components/schemas/CaptureSleep'
        habit:
          $ref: '#/components/schemas/CaptureHabit'
        weight:
          $ref: '#/components/schemas/CaptureWeight'
        check_in:
          $ref: '#/components/schemas/CaptureCheckIn'
        food:
          $ref: '#/components/schemas/CaptureFood'
    Outcome:
      type: object
      required: [item]
      additionalProperties: false
      properties:
        item:
          $ref: '#/components/schemas/CaptureItem'
        summary:
          type: string
        error:
          type: string
    CaptureWater:
      type: object
      required: [amount_ml]
      additionalProperties: false
      properties:
        amount_ml:
          type: integer
    CaptureSleep:
      type: object
      required: [minutes, date]
      additionalProperties: false
      properties:
        minutes:
          type: integer
        date:
          type: string
          format: date-time
        quality:
          type: integer
    CaptureHabit:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        id:
          type: string
          format: uuid
    CaptureWeight:
      type: object
      required: [kg]
      additionalProperties: false
      properties:
        kg:
          type: number
    CaptureCheckIn:
      type: object
      required: [mood, energy]
      additionalProperties: false
      properties:
        mood:
          type: integer
        energy:
          type: integer
        notes:
          type: string
    CaptureFood:
      type: object
      required: [query, grams]
      additionalProperties: false
      properties:
        query:
          type: string
        grams:
          type: number
        ingredient_id:
          type: string
          format: uuid
        matched_name:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [message]
      properties:
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    SignupRequest:
      type: object
      required: [email, password, passwordConfirmation]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        passwordConfirmation:
          type: string
        displayName:
          type: string
        timezone:
          type: string
          description: IANA zone, e.g. Europe/Lisbon. Defaults to UTC.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    GoogleRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
    AppleRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string
          description: The raw nonce whose SHA-256 was sent to Apple.
        fullName:
          type: string
          description: Apple sends the name only on the first sign-in.
        email:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    AuthResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: "Opaque session token. Send as `Authorization: Bearer`."
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, displayName, timezone, needsOnboarding]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        timezone:
          type: string
        needsOnboarding:
          type: boolean
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    OnboardingRequest:
      type: object
      required: [focusAreas, coachingStyle]
      properties:
        focusAreas:
          type: array
          items:
            type: string
        coachingStyle:
          type: string
          description: direct, supportive, socratic or custom. Free text is treated as custom.
        coachingStyleCustom:
          type: string
        nearTermGoal:
          type: string
    OnboardingResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        threadId:
          type: string
          format: uuid
          description: The coach thread opened for the first conversation.
    TodayResponse:
      type: object
      required: [user, snapshot]
      properties:
        user:
          $ref: '#/components/schemas/User'
        snapshot:
          $ref: '#/components/schemas/TodaySnapshot'
    TodaySnapshot:
      type: object
      required: [range, checkedInToday, streak, goalActivity7d, pendingMemories, goals, hydration, sleep, activityCalories, timeline, deltas, nudges]
      properties:
        range:
          type: string
        checkedInToday:
          type: boolean
        streak:
          type: integer
        goalActivity7d:
          type: integer
        pendingMemories:
          type: integer
        goals:
          type: array
          items:
            $ref: '#/components/schemas/TodayGoal'
        lastThread:
          $ref: '#/components/schemas/TodayThread'
        nextStep:
          $ref: '#/components/schemas/NextStep'
        hydration:
          $ref: '#/components/schemas/Hydration'
        sleep:
          $ref: '#/components/schemas/SleepSummary'
        activityCalories:
          type: number
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        deltas:
          $ref: '#/components/schemas/Deltas'
        nudges:
          type: array
          items:
            $ref: '#/components/schemas/Nudge'
        briefing:
          type: string
    TodayGoal:
      type: object
      required: [id, title, category, status, milestoneTotal, milestoneDone]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        status:
          type: string
        targetDate:
          type: string
          format: date-time
        milestoneTotal:
          type: integer
        milestoneDone:
          type: integer
        progress:
          type: integer
          description: Percent, when the goal tracks a measurable target.
    TodayThread:
      type: object
      required: [id, title, kind, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
        updatedAt:
          type: string
          format: date-time
    NextStep:
      type: object
      required: [kind, eyebrow, title, body, cta, href]
      properties:
        kind:
          type: string
        eyebrow:
          type: string
        title:
          type: string
        body:
          type: string
        cta:
          type: string
        href:
          type: string
          description: A web path; native clients map it to a screen.
    Hydration:
      type: object
      required: [todayML, targetML, percent]
      properties:
        todayML:
          type: integer
        targetML:
          type: integer
        percent:
          type: integer
    SleepSummary:
      type: object
      required: [logged, durationMinutes]
      properties:
        logged:
          type: boolean
        durationMinutes:
          type: integer
        quality:
          type: integer
    TimelineEntry:
      type: object
      required: [kind, label, at, title, icon]
      properties:
        kind:
          type: string
        label:
          type: string
        at:
          type: string
          format: date-time
        title:
          type: string
        detail:
          type: string
        href:
          type: string
        icon:
          type: string
    Delta:
      type: object
      required: [pct, direction, hasPrior]
      properties:
        pct:
          type: number
        direction:
          type: integer
          description: -1 down, 0 flat, 1 up.
        hasPrior:
          type: boolean
    Deltas:
      type: object
