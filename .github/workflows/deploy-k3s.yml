name: Deploy to k3s (staging)

# Manual path for the k3s/ArgoCD deploy. Builds + pushes the image to GHCR,
# then writes the tag into north-infra so ArgoCD deploys web to the k3s
# staging namespace. Production is promoted via the infra promote workflow
# once staging is verified.
#
# Requires:
#   - INFRA_TOKEN secret (PAT with contents:write on NorthAIProject/north-infra)
#   - north-infra apps/web/values-staging.yaml with an image.tag field

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # NorthAIProject/north-client

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve repo (lowercase)
        id: repo
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:${{ github.sha }}
            ${{ steps.repo.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-staging:
    name: Bump k3s staging tag in north-infra
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout north-infra
        uses: actions/checkout@v4
        with:
          repository: NorthAIProject/north-infra
          token: ${{ secrets.INFRA_TOKEN }} # PAT with contents:write on north-infra
          ref: main

      - name: Install yq
        run: sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq

      - name: Write staging image tag
        run: yq -i ".image.tag = \"${{ needs.build.outputs.sha_tag }}\"" apps/web/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name "north-client-ci"
          git config user.email "ci@north.ai"
          if git diff --quiet; then echo "no tag change"; exit 0; fi
          git add apps/web/values-staging.yaml
          git commit -m "chore(web): bump k3s staging image to ${{ needs.build.outputs.sha_tag }}"
          git push origin main
