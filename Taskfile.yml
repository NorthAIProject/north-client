version: "3"

dotenv: [".env"]

vars:
  MIGRATIONS_DIR: ./migrations

tasks:
  # ---------------------------------------------------------------------------
  # Development
  # ---------------------------------------------------------------------------
  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:8090" --cmd="go run ./cmd/web" --open-browser=false

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - |
        TEMPLUI_PATH="$(go list -mod=mod -m -f {{`'{{.Dir}}'`}} github.com/templui/templui)" && \
        printf '%s\n' \
          '@source "./**/*.templ";' \
          '@source "./**/*.js";' \
          "@source \"$TEMPLUI_PATH/components/**/*.templ\";" \
          "@source \"$TEMPLUI_PATH/components/**/*.js\";" \
          > ./web/assets/css/sources.generated.css && \
        tailwindcss -i ./web/assets/css/input.css -o ./web/assets/css/output.css --watch

  dev:
    desc: Start development server with hot reload
    cmds:
      - task --parallel tailwind templ

  worker:
    desc: Run the background worker
    cmds:
      - go run ./cmd/worker

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  db:up:
    desc: Start Postgres and MinIO
    cmds:
      - docker compose up -d
      - docker compose ps

  db:down:
    desc: Stop Postgres and MinIO (keeps volumes)
    cmds:
      - docker compose down

  db:reset:
    desc: Destroy and recreate the database volume, then migrate
    prompt: This deletes all local database and object storage data. Continue?
    cmds:
      - docker compose down -v
      - task: db:up
      - task: db:wait
      - task: migrate:up

  db:wait:
    desc: Block until Postgres accepts connections
    cmds:
      - |
        for i in $(seq 1 30); do
          if docker compose exec -T postgres pg_isready -U north -d north >/dev/null 2>&1; then
            echo "postgres ready"; exit 0
          fi
          sleep 1
        done
        echo "postgres did not become ready in 30s" >&2; exit 1

  psql:
    desc: Open a psql shell against the local database
    interactive: true
    cmds:
      - docker compose exec postgres psql -U north -d north

  # ---------------------------------------------------------------------------
  # Migrations (goose)
  # ---------------------------------------------------------------------------
  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" down

  migrate:status:
    desc: Show migration status
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" status

  migrate:new:
    desc: Create a new migration. Usage: task migrate:new -- add_users_table
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql

  # ---------------------------------------------------------------------------
  # Codegen
  # ---------------------------------------------------------------------------
  sqlc:
    desc: Regenerate database access code from SQL
    cmds:
      - sqlc generate

  generate:
    desc: Run every code generator
    cmds:
      - go tool templ generate
      - sqlc generate

  # ---------------------------------------------------------------------------
  # Quality
  # ---------------------------------------------------------------------------
  build:
    desc: Build all binaries
    cmds:
      - go tool templ generate
      - go build ./...

  test:
    desc: Run the offline test suite
    cmds:
      - go test ./...

  test:live:
    desc: Run tests that call real AI providers (costs money, needs API keys)
    cmds:
      - go test -tags live -count=1 ./internal/ai/...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go and templ sources
    cmds:
      - go fmt ./...
      - go tool templ fmt .

  check:
    desc: Everything CI runs
    cmds:
      - task: fmt
      - task: vet
      - task: build
      - task: test
