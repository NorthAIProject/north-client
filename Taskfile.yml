version: "3"

dotenv: [".env"]

vars:
  MIGRATIONS_DIR: ./migrations

tasks:
  # ---------------------------------------------------------------------------
  # Development
  # ---------------------------------------------------------------------------
  templ:
    desc: Run templ with integrated server and hot reload
    deps: [port:free]
    cmds:
      # scripts/dev-web.sh rather than `go run ./cmd/web` — see that file for
      # why. Short version: `go run` leaves the real server orphaned on the
      # port every time templ restarts or you Ctrl-C.
      - GOFLAGS=-mod=mod go tool templ generate --watch --proxy="http://localhost:8090" --cmd="./scripts/dev-web.sh" --open-browser=false

  # Frees the dev port if a previous run left something behind. Runs before the
  # watcher rather than being something to remember: the whole problem with a
  # stale process is that you find out about it from a confusing symptom.
  port:free:
    internal: true
    cmds:
      - lsof -ti tcp:{{.PORT | default "8090"}} -sTCP:LISTEN 2>/dev/null | xargs -r kill 2>/dev/null || true

  dev:stop:
    desc: Kill anything left holding the dev port
    cmds:
      - task: port:free

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - |
        TEMPLUI_PATH="$(go list -mod=mod -m -f {{`'{{.Dir}}'`}} github.com/templui/templui)" && \
        printf '%s\n' \
          '@source "./**/*.templ";' \
          '@source "./**/*.js";' \
          "@source \"$TEMPLUI_PATH/components/**/*.templ\";" \
          "@source \"$TEMPLUI_PATH/components/**/*.js\";" \
          > ./web/assets/css/sources.generated.css && \
        tailwindcss -i ./web/assets/css/input.css -o ./web/assets/css/output.css --watch

  dev:
    desc: Start development server with hot reload (expects DB already up)
    cmds:
      - task --parallel tailwind templ

  # Full local stack: containers, wait for Postgres, then hot-reload app.
  # Schema migrations run automatically when the web process starts.
  dev:up:
    desc: Start Postgres/MinIO and the hot-reload app
    cmds:
      - task: db:up
      - task: db:wait
      - task: dev

  dev:down:
    desc: Stop Postgres/MinIO (alias for db:down; keeps volumes)
    cmds:
      - task: db:down

  worker:
    desc: Run the background worker
    cmds:
      - go run ./cmd/worker

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  db:up:
    desc: Start Postgres and MinIO
    cmds:
      # --remove-orphans: drop services that left this compose file.
      # Free fixed host ports if a stale container from another project still holds them.
      - |
        for name in north-postgres north-minio; do
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo "removing stale container $name (from an older compose project)"
            docker rm -f "$name"
          fi
        done
      - docker compose up -d --remove-orphans
      - docker compose ps

  db:down:
    desc: Stop Postgres and MinIO (keeps volumes)
    cmds:
      - docker compose down --remove-orphans

  db:reset:
    desc: Destroy and recreate the database volume (schema applied on next app start)
    prompt: This deletes all local database and object storage data. Continue?
    cmds:
      - docker compose down -v --remove-orphans
      - task: db:up
      - task: db:wait

  db:wait:
    desc: Block until Postgres accepts connections
    cmds:
      - |
        for i in $(seq 1 30); do
          if docker compose exec -T postgres pg_isready -U north -d north >/dev/null 2>&1; then
            echo "postgres ready"; exit 0
          fi
          sleep 1
        done
        echo "postgres did not become ready in 30s" >&2; exit 1

  psql:
    desc: Open a psql shell against the local database
    interactive: true
    cmds:
      - docker compose exec postgres psql -U north -d north

  # ---------------------------------------------------------------------------
  # Migrations (goose)
  # ---------------------------------------------------------------------------
  # Prefer app start for "up": web and worker call database.Migrate on boot
  # with embedded SQL. These tasks remain for inspection and authoring.
  migrate:up:
    desc: Apply pending migrations manually (also runs automatically on app start)
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" down

  migrate:status:
    desc: Show migration status
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" status

  migrate:new:
    desc: "Create a new migration. Usage: task migrate:new -- add_users_table"
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql

  # ---------------------------------------------------------------------------
  # Codegen
  # ---------------------------------------------------------------------------
  sqlc:
    desc: Regenerate database access code from SQL
    cmds:
      - sqlc generate

  generate:
    desc: Run every code generator
    cmds:
      - GOFLAGS=-mod=mod go tool templ generate
      - sqlc generate

  # ---------------------------------------------------------------------------
  # Quality
  # ---------------------------------------------------------------------------
  assets:
    desc: Build Tailwind CSS (required before go build/test — css is gitignored)
    cmds:
      - bash scripts/build-css.sh

  build:
    desc: Build all binaries
    cmds:
      - GOFLAGS=-mod=mod go tool templ generate
      - sqlc generate
      - task: assets
      - go build ./...

  mcp:
    desc: Run the MCP server (needs MCP_API_TOKEN and MCP_USER_ID)
    cmds:
      - go run ./cmd/mcp-server

  test:
    desc: Run the offline test suite
    cmds:
      - go test ./...

  test:eval:
    desc: Run the grounding evals, offline tier (no API key, no database)
    cmds:
      - go test -count=1 -v ./internal/ai/eval/...

  test:live:
    desc: Run tests that call real AI providers (costs money, needs API keys)
    cmds:
      - go test -tags live -count=1 -v ./internal/ai/...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go (gofumpt) and templ sources
    cmds:
      - go tool gofumpt -w .
      - |
        # Generated Lucide dumps from templUI — leave generator formatting.
        git checkout -- \
          web/shared/ui/icon/icon_data.go \
          web/shared/ui/icon/icon_defs.go 2>/dev/null || true
      - go tool templ fmt .

  hooks:
    desc: Install versioned git hooks (.githooks → core.hooksPath)
    cmds:
      - bash scripts/install-hooks.sh

  check:
    desc: Everything CI runs (local equivalent of .github/workflows/ci.yml)
    cmds:
      - bash scripts/check-no-build-artifacts.sh
      - GOFLAGS=-mod=mod go tool templ generate
      - task: assets
      - |
        go tool gofumpt -w .
        git checkout -- \
          web/shared/ui/icon/icon_data.go \
          web/shared/ui/icon/icon_defs.go 2>/dev/null || true
        if ! git diff --exit-code -- '*.go'; then
          echo "Go files need gofumpt -w . (run: task fmt)"
          exit 1
        fi
      - task: vet
      - go test ./... -count=1
      - go build ./...
