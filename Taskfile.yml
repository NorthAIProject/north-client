version: "3"

dotenv: [".env"]

vars:
  MIGRATIONS_DIR: ./migrations

tasks:
  # ---------------------------------------------------------------------------
  # Development
  # ---------------------------------------------------------------------------
  api:
    desc: Run the API server
    deps: [port:free]
    cmds:
      - go run ./cmd/api

  # Frees the dev port if a previous run left something behind. Runs before the
  # watcher rather than being something to remember: the whole problem with a
  # stale process is that you find out about it from a confusing symptom.
  port:free:
    internal: true
    cmds:
      - lsof -ti tcp:{{.PORT | default "8090"}} -sTCP:LISTEN 2>/dev/null | xargs -r kill 2>/dev/null || true

  dev:stop:
    desc: Kill anything left holding the dev port
    cmds:
      - task: port:free

  # The worker runs alongside the API process, not on request. Every async
  # feature — Strava sync, memory extraction, thread summaries, the daily
  # briefing, document indexing — is a job, and a job nobody claims is a
  # feature that silently does nothing. Leaving the worker as a separate
  # command people had to remember cost eleven days of "Strava is broken".
  dev:
    desc: Start the API server and the background worker (expects DB already up)
    cmds:
      - task --parallel api worker

  # Full local stack: containers, wait for Postgres, then the app.
  # Schema migrations run automatically when the API process starts.
  dev:up:
    desc: Start Postgres/MinIO and the app
    cmds:
      - task: db:up
      - task: db:wait
      - task: dev

  dev:down:
    desc: Stop Postgres/MinIO/whisper (alias for db:down; keeps volumes)
    cmds:
      - task: db:down

  worker:
    desc: Run the background worker
    cmds:
      - go run ./cmd/worker

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  db:up:
    desc: Start Postgres, MinIO and whisper (speech to text)
    cmds:
      # --remove-orphans: drop services that left this compose file.
      # Free fixed host ports if a stale container from another project still holds them.
      - |
        for name in north-postgres north-minio; do
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo "removing stale container $name (from an older compose project)"
            docker rm -f "$name"
          fi
        done
      - docker compose up -d --remove-orphans
      - docker compose ps

  db:down:
    desc: Stop Postgres, MinIO and whisper (keeps volumes)
    cmds:
      - docker compose down --remove-orphans

  db:reset:
    desc: Destroy and recreate the database volume (schema applied on next app start)
    prompt: This deletes all local database and object storage data. Continue?
    cmds:
      - docker compose down -v --remove-orphans
      - task: db:up
      - task: db:wait

  db:wait:
    desc: Block until Postgres accepts connections
    cmds:
      - |
        for i in $(seq 1 30); do
          if docker compose exec -T postgres pg_isready -U north -d north >/dev/null 2>&1; then
            echo "postgres ready"; exit 0
          fi
          sleep 1
        done
        echo "postgres did not become ready in 30s" >&2; exit 1

  psql:
    desc: Open a psql shell against the local database
    interactive: true
    cmds:
      - docker compose exec postgres psql -U north -d north

  # ---------------------------------------------------------------------------
  # Migrations (goose)
  # ---------------------------------------------------------------------------
  # Prefer app start for "up": the API and worker call database.Migrate on boot
  # with embedded SQL. These tasks remain for inspection and authoring.
  migrate:up:
    desc: Apply pending migrations manually (also runs automatically on app start)
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" down

  migrate:status:
    desc: Show migration status
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" status

  migrate:new:
    desc: "Create a new migration. Usage: task migrate:new -- add_users_table"
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql

  # ---------------------------------------------------------------------------
  # Codegen
  # ---------------------------------------------------------------------------
  sqlc:
    desc: Regenerate database access code from SQL
    cmds:
      - sqlc generate

  generate:
    desc: Run every code generator
    cmds:
      - sqlc generate

  # ---------------------------------------------------------------------------
  # Quality
  # ---------------------------------------------------------------------------
  # The body figure, for web and iOS alike. The iOS paths assume the sibling
  # checkout; see web/assets/models/README.md.
  bodymap:
    desc: Rebuild the body figure (web GLB, flat SVG, iOS USDZ, skin and light rig)
    cmds:
      - go run ./scripts/bodymap -usdz ../north-ios-app/khepri/khepri/Resources/BodyMap.usdz -shell ../north-ios-app/khepri/khepri/Resources/BodyShell.bin -ibl ../north-ios-app/khepri/khepri/Resources/BodyStudio.png

  build:
    desc: Build all binaries
    cmds:
      - sqlc generate
      - go build ./...

  mcp:
    desc: Run the MCP server (needs MCP_API_TOKEN and MCP_USER_ID)
    cmds:
      - go run ./cmd/mcp-server

  test:
    desc: Run the offline test suite
    cmds:
      - go test ./...

  test:eval:
    desc: Run the grounding evals, offline tier (no API key, no database)
    cmds:
      - go test -count=1 -v ./internal/ai/eval/...

  test:live:
    desc: Run tests that call real AI providers (costs money, needs API keys)
    cmds:
      # Both eval packages. internal/capture/eval is not under internal/ai, and
      # a live tier that is never run passes for the worst possible reason.
      - go test -tags live -count=1 -v ./internal/ai/... ./internal/capture/eval/...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go (gofumpt)
    cmds:
      - go tool gofumpt -w .

  hooks:
    desc: Install versioned git hooks (.githooks → core.hooksPath)
    cmds:
      - bash scripts/install-hooks.sh

  check:
    desc: Everything CI runs (local equivalent of .github/workflows/ci.yml)
    cmds:
      - bash scripts/check-no-build-artifacts.sh
      - |
        go tool gofumpt -w .
        if ! git diff --exit-code -- '*.go'; then
          echo "Go files need gofumpt -w . (run: task fmt)"
          exit 1
        fi
      - task: vet
      - go test ./... -count=1
      - go build ./...
