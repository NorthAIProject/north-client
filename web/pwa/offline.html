<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1C1C1F" />
    <title>Offline — Khepri</title>

    <!--
      Every style is inline and no file is referenced.

      This page is what a person sees when the network is gone, so anything it
      links to is a request that has already failed once. Depending on the
      cached stylesheet would mean the offline page renders unstyled in exactly
      the case where a cache miss is most likely — a first run, or the pass
      after a cache version bump.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #1c1c1f;
        color: #f4f4f5;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        text-align: left;
      }
      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a1a1aa;
        margin: 0 0 0.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #d4d4d8;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        padding: 0.625rem 1.125rem;
        border-radius: 0.5rem;
        border: 1px solid #3f3f46;
        background: #f4f4f5;
        color: #18181b;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      button:focus-visible {
        outline: 2px solid #f4f4f5;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Khepri</p>
      <h1 data-i18n="title">You're offline</h1>
      <p data-i18n="body">
        Khepri keeps your coach, your goals and your check-ins on the server, so
        it needs a connection to show them. Nothing you had already saved is
        lost — this page is only what the app can reach right now.
      </p>
      <button type="button" data-i18n="retry" onclick="location.reload()">Try again</button>
    </main>

    <!--
      The language is chosen here, in the browser, not on the server.

      The service worker precaches this page once, at install, and serves that
      copy for every failed navigation afterwards. A page rendered for the
      request's locale would freeze whatever language was in force at install
      time, for everyone on the device, until the next cache bump. So all four
      languages ship in the file and the browser's own preference picks one,
      with English in the markup for anything that does not run the script.

      The picking mirrors i18n.Negotiate: a bare "pt" is Brazilian, any other
      Portuguese region is European.
    -->
    <script>
      (function () {
        var copy = {
          es: {
            doc: "Sin conexión — Khepri",
            title: "Estás sin conexión",
            body: "Khepri guarda tu entrenador, tus objetivos y tus registros en el servidor, así que necesita conexión para mostrártelos. No se ha perdido nada de lo que ya habías guardado — esta página es solo lo que la app puede alcanzar ahora mismo.",
            retry: "Intentar de nuevo",
          },
          "pt-PT": {
            doc: "Sem ligação — Khepri",
            title: "Estás sem ligação",
            body: "O Khepri guarda o teu treinador, os teus objetivos e os teus registos no servidor, por isso precisa de ligação para os mostrar. Nada do que já tinhas guardado se perdeu — esta página é apenas o que a app consegue alcançar neste momento.",
            retry: "Tentar outra vez",
          },
          "pt-BR": {
            doc: "Sem conexão — Khepri",
            title: "Você está sem conexão",
            body: "O Khepri guarda seu treinador, suas metas e seus registros no servidor, então precisa de conexão para mostrá-los. Nada do que você já tinha salvado foi perdido — esta página é só o que o app consegue acessar agora.",
            retry: "Tentar de novo",
          },
        };

        function pick(langs) {
          for (var i = 0; i < langs.length; i++) {
            var l = String(langs[i] || "").toLowerCase();
            if (l === "en" || l.indexOf("en-") === 0) return "en";
            if (l === "es" || l.indexOf("es-") === 0) return "es";
            if (l === "pt" || l === "pt-br") return "pt-BR";
            if (l.indexOf("pt-") === 0) return "pt-PT";
          }
          return "en";
        }

        var nav = window.navigator || {};
        var tag = pick(nav.languages && nav.languages.length ? nav.languages : [nav.language]);
        var t = copy[tag];
        if (!t) return;

        document.documentElement.lang = tag;
        document.title = t.doc;
        var nodes = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].textContent = t[nodes[i].getAttribute("data-i18n")];
        }
      })();
    </script>
  </body>
</html>
