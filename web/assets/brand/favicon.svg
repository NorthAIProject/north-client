<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img">
  <title>Khepri</title>
  <!--
    Tab icon of the Khepri mark: a sun over a scarab, wings wrapping both.

    Drawn to survive 16px. The full mark is the raster khepri-logo-mark.png;
    this is the silhouette that still reads in a browser tab. Same split as
    the old star favicon: flat fills, fully opaque, prefers-color-scheme
    because a favicon has no parent colour to inherit.
  -->
  <style>
    .gold { fill: #B8923A; }
    .navy { fill: #10202C; }
    .ring { fill: none; stroke: #B8923A; stroke-width: 2.4; }
    @media (prefers-color-scheme: dark) {
      .gold { fill: #E0C070; }
      .navy { fill: #1A2C3A; }
      .ring { stroke: #E0C070; }
    }
  </style>
  <path class="gold" d="M20 20 C8 42 16 70 50 90 C30 66 18 44 28 22 Z"/>
  <path class="gold" d="M80 20 C92 42 84 70 50 90 C70 66 82 44 72 22 Z"/>
  <circle class="gold" cx="50" cy="26" r="13"/>
  <rect class="gold" x="48.2" y="6" width="3.6" height="8" rx="1"/>
  <rect class="gold" x="48.2" y="6" width="3.6" height="8" rx="1" transform="rotate(40 50 26)"/>
  <rect class="gold" x="48.2" y="6" width="3.6" height="8" rx="1" transform="rotate(-40 50 26)"/>
  <rect class="gold" x="48.2" y="6" width="3.6" height="8" rx="1" transform="rotate(80 50 26)"/>
  <rect class="gold" x="48.2" y="6" width="3.6" height="8" rx="1" transform="rotate(-80 50 26)"/>
  <ellipse class="navy" cx="50" cy="64" rx="13" ry="18"/>
  <ellipse class="ring" cx="50" cy="64" rx="13" ry="18"/>
</svg>
